<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HackerEye | Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#07131F,#0F2747);

overflow:hidden;

}

body::before{

content:"";

position:absolute;

width:500px;

height:500px;

background:#00C3FF;

filter:blur(170px);

border-radius:50%;

top:-150px;

right:-120px;

opacity:.25;

}

body::after{

content:"";

position:absolute;

width:450px;

height:450px;

background:#2563EB;

filter:blur(170px);

border-radius:50%;

bottom:-150px;

left:-120px;

opacity:.25;

}

.register-box{

width:470px;

padding:45px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border-radius:20px;

box-shadow:0 20px 45px rgba(0,0,0,.45);

border:1px solid rgba(255,255,255,.1);

position:relative;

z-index:10;

color:white;

}

.logo{

text-align:center;

font-size:55px;

color:#00C3FF;

margin-bottom:10px;

}

.register-box h2{

text-align:center;

margin-bottom:30px;

font-weight:700;

}

.form-control{

height:55px;

background:rgba(255,255,255,.08);

border:none;

color:white;

}

.form-control::placeholder{

color:#ddd;

}

.form-control:focus{

background:rgba(255,255,255,.15);

color:white;

box-shadow:none;

}

.btn-register{

width:100%;

height:55px;

background:#00C3FF;

border:none;

border-radius:12px;

font-weight:600;

font-size:18px;

transition:.3s;

}

.btn-register:hover{

background:#009ad1;

transform:translateY(-3px);

}

.strength{

height:8px;

width:100%;

background:#444;

border-radius:10px;

margin-top:8px;

overflow:hidden;

}

.bar{

height:100%;

width:0%;

background:red;

transition:.3s;

}

.bottom{

margin-top:20px;

text-align:center;

}

.bottom a{

color:#00C3FF;

text-decoration:none;

}

.back{

position:absolute;

top:25px;

left:25px;

color:white;

text-decoration:none;

font-size:18px;

}

</style>

</head>

<body>

<a href="/" class="back">

<i class="fas fa-arrow-left"></i>

Home

</a>

<div class="register-box">

<div class="logo">

<i class="fas fa-user-shield"></i>

</div>

<h2>Create Account</h2>

<form action="/register" method="POST">

<div class="mb-3">

<input
type="text"
name="username"
class="form-control"
placeholder="Username"
required>

</div>

<div class="mb-3">

<input
type="email"
name="email"
class="form-control"
placeholder="Email Address"
required>

</div>

<div class="mb-3">

<input
type="password"
name="password"
id="password"
class="form-control"
placeholder="Password"
required
onkeyup="checkStrength()">

<div class="strength">

<div class="bar" id="bar"></div>

</div>

</div>

<button class="btn btn-register">

<i class="fas fa-user-plus"></i>

Register

</button>

<div class="bottom">

Already have an account?

<a href="/login">

Login

</a>

</div>

</form>

</div>

<script>

function checkStrength(){

let pass=document.getElementById("password").value;

let bar=document.getElementById("bar");

if(pass.length<5){

bar.style.width="30%";

bar.style.background="red";

}

else if(pass.length<8){

bar.style.width="65%";

bar.style.background="orange";

}

else{

bar.style.width="100%";

bar.style.background="#22C55E";

}

}

</script>

</body>

</html>
