<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HackerEye | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#06111F,#0F2747);

overflow:hidden;

}

body::before{

content:"";

position:absolute;

width:500px;

height:500px;

background:#00c3ff;

border-radius:50%;

filter:blur(150px);

top:-150px;

right:-100px;

opacity:.25;

}

body::after{

content:"";

position:absolute;

width:450px;

height:450px;

background:#1d4ed8;

border-radius:50%;

filter:blur(160px);

bottom:-150px;

left:-120px;

opacity:.25;

}

.login-box{

position:relative;

width:420px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

padding:45px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.4);

border:1px solid rgba(255,255,255,.1);

color:white;

z-index:10;

}

.logo{

font-size:55px;

text-align:center;

color:#00c3ff;

margin-bottom:15px;

}

.login-box h2{

text-align:center;

margin-bottom:25px;

font-weight:700;

}

.form-control{

height:55px;

background:rgba(255,255,255,.08);

border:none;

color:white;

}

.form-control::placeholder{

color:#ddd;

}

.form-control:focus{

background:rgba(255,255,255,.15);

color:white;

box-shadow:none;

}

.btn-login{

width:100%;

height:55px;

background:#00c3ff;

border:none;

font-weight:600;

font-size:18px;

border-radius:12px;

transition:.3s;

}

.btn-login:hover{

background:#009ad1;

transform:translateY(-3px);

}

.links{

display:flex;

justify-content:space-between;

margin-top:18px;

}

.links a{

color:#00c3ff;

text-decoration:none;

font-size:14px;

}

.back{

position:absolute;

top:30px;

left:30px;

color:white;

font-size:18px;

text-decoration:none;

}

</style>

</head>

<body>

<a href="/" class="back">

<i class="fas fa-arrow-left"></i> Home

</a>

<div class="login-box">

<div class="logo">

<i class="fas fa-shield-halved"></i>

</div>

<h2>Welcome Back</h2>

<form action="/login" method="POST">

<div class="mb-3">

<input
type="text"
name="username"
class="form-control"
placeholder="Username"
required>

</div>

<div class="mb-3">

<input
type="password"
name="password"
class="form-control"
placeholder="Password"
required>

</div>

<button class="btn btn-login">

<i class="fas fa-right-to-bracket"></i>

Login

</button>

<div class="links">

<a href="#">Forgot Password?</a>

<a href="/register">Create Account</a>

</div>

</form>

</div>

</body>

</html>
